[agent]
courier_reference = "dispatch/native:latest"
name = "release-notes"
version = "0.1.0"
entrypoint = "job"
skills = ["skills/release-notes"]
evals = ["evals/smoke.eval"]

[agent.instructions]
soul = "SOUL.md"

[agent.model]
id = "claude-sonnet-4-6"
provider = "anthropic"

[[agent.model.fallbacks]]
id = "gpt-4o"
provider = "openai"

[agent.limits]
iterations = 20
tool_calls = 40
tool_output = 65536

[agent.timeouts]
run = "180s"
tool = "30s"
llm = "120s"
