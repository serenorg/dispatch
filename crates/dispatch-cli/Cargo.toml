[package]
name = "dispatch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for building, verifying, and running Dispatch agent parcels."
readme = "../../README.md"
keywords = ["agents", "cli", "packaging", "dispatch"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
dispatch-core = { path = "../dispatch-core" }
dispatch-deployment-protocol = { path = "../dispatch-deployment-protocol" }
dispatch-process = { path = "../dispatch-process" }
anyhow.workspace = true
clap.workspace = true
futures.workspace = true
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
toml.workspace = true
tempfile.workspace = true
jsonschema.workspace = true
chrono.workspace = true
cron.workspace = true
sha2.workspace = true
tar.workspace = true
base64.workspace = true
signal-hook.workspace = true
atomic-write-file.workspace = true
tiny_http.workspace = true
url.workspace = true
ureq.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
serial_test = { version = "3", features = ["file_locks"] }
